  <!-- Critical Above-the-Fold CSS (Inline for Performance) -->
  <style>
    /* Critical Styles - Inline for instant rendering.
       These values mirror the Cobalt palette in src/styles/cobalt.css so the
       first paint matches the stylesheet that loads a moment later. */
    :root {
      --primary: #4c8dff;
      --primary-dark: #2e6fe0;
      --primary-rgb: rgba(76, 141, 255, 0.1);
      --bg-primary: #0c1119;
      --bg-secondary: #141c28;
      --bg-tertiary: #1b2533;
      --text-primary: #e9eff7;
      --text-secondary: #a9b6c6;
      --border-color: #2b3a4e;
      --shadow-primary: rgba(76, 141, 255, 0.1);
      --transition-normal: 0.3s ease;
      --transition-slow: 0.5s ease;
    }

    @media (prefers-color-scheme: light) {
      :root:not(.dark):not([data-theme='dark']) {
        --primary: #2e6fe0;
        --primary-dark: #1f55b0;
        --primary-rgb: rgba(46, 111, 224, 0.1);
        --bg-primary: #fafbfd;
        --bg-secondary: #ffffff;
        --bg-tertiary: #f1f4f8;
        --text-primary: #101722;
        --text-secondary: #465363;
        --border-color: #d9e1ea;
        --shadow-primary: rgba(46, 111, 224, 0.1);
      }
    }
    
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;font-feature-settings:'kern' 1,'liga' 1,'calt' 1}
    
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background-color:var(--bg-primary);
      color:var(--text-primary);
      line-height:1.6;
      overflow-x:hidden;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale
    }
    
    /* App container optimization */
    #root{min-height:100vh;display:flex;flex-direction:column}
    
    /* Loading states */
    .section-loader{
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
      background-size:200% 100%;
      animation:loading 1.5s infinite
    }
    
    @keyframes loading{
      0%{background-position:-200% 0}
      100%{background-position:200% 0}
    }
    
    /* Scroll Progress Bar - Critical */
    .scroll-progress{
      position:fixed;
      top:0;
      left:0;
      width:0%;
      height:3px;
      background:linear-gradient(90deg,var(--primary),var(--primary-dark));
      z-index:1000;
      transition:width 0.1s ease-out
    }
    
    /* Theme Toggle - Critical */
    .theme-toggle{
      position:fixed;
      top:20px;
      right:20px;
      width:50px;
      height:50px;
      border-radius:50%;
      background:var(--bg-secondary);
      border:2px solid var(--border-color);
      color:var(--text-primary);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:1.2rem;
      z-index:999;
      transition:all var(--transition-normal);
      backdrop-filter:blur(10px)
    }
    
    .theme-toggle:hover{
      background:var(--primary);
      color:var(--bg-primary);
      transform:scale(1.1);
      box-shadow:0 8px 25px var(--shadow-primary)
    }
    
    /* Header critical styles */
    .header{
      position:fixed;
      top:0;
      width:100%;
      z-index:998;
      backdrop-filter:blur(20px);
      background:var(--bg-primary);
      border-bottom:1px solid var(--border-color)
    }
    
    /* Hero section critical */
    .hero-section{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg-primary)
    }

    /* Dark theme by default */
    .dark{
      --primary:#4c8dff;
      --primary-dark:#2e6fe0;
      --accent:#4c8dff;
      --background:#0c1119;
      --surface:#141c28;
      --bg-primary:#0c1119;
      --bg-secondary:#141c28;
      --bg-tertiary:#1b2533;
      --text-primary:#e9eff7;
      --text-secondary:#a9b6c6;
      --border:#2b3a4e;
      --border-color:#2b3a4e
    }

    /* Light theme */
    .light{
      --primary:#2e6fe0;
      --primary-dark:#1f55b0;
      --accent:#2e6fe0;
      --background:#fafbfd;
      --surface:#ffffff;
      --bg-primary:#fafbfd;
      --bg-secondary:#ffffff;
      --bg-tertiary:#f1f4f8;
      --text-primary:#101722;
      --text-secondary:#465363;
      --border:#d9e1ea;
      --border-color:#d9e1ea
    }
    
    /* Font loading optimization */
    .font-loading{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif
    }
    
    /* Error boundary styles */
    .error-fallback{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      min-height:200px;
      padding:20px;
      color:var(--text-secondary)
    }
    
    /* Hide elements until JS loads */
    .js-only{opacity:0;transition:opacity 0.3s ease}
    .js-loaded .js-only{opacity:1}
    
    /* Reduced motion preference */
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:0.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:0.01ms!important;
        scroll-behavior:auto!important
      }
      .scroll-progress{transition:none}
    }
    
    /* Optimize for print */
    @media print{
      .theme-toggle,.scroll-progress,.back-to-top{display:none!important}
      body{background:white!important;color:black!important}
    }
  </style>

<!-- Theme lives on <html>, applied by ThemeContext; hard-coding it here
     pinned the page to dark regardless of the user's preference. -->
<body class="font-loading">
  <!-- App Root -->
  <div id="root">
    <!-- Fallback content for non-JS users -->
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>Umutcan Algan - Full-Stack Developer</h1>
        <p>This website requires JavaScript to function properly. Please enable JavaScript in your browser.</p>
        <p>For the best experience, visit: <a href="https://github.com/ucanalgan">GitHub Profile</a></p>
      </div>
    </noscript>
    
    <!-- Loading indicator while JS loads -->
    <div id="app-loading" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 9999;">
      <div style="width: 40px; height: 40px; border: 3px solid var(--border-color); border-top: 3px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px;"></div>
      <p style="color: #a8b2d1; font-size: 14px;">Loading...</p>
    </div>
  </div>
  
  <!-- Load non-critical CSS asynchronously -->
  <script>
    // Load full CSS after critical rendering
    const loadCSS = (href) => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = href;
      document.head.appendChild(link);
    };
    
    // Load Remix Icons asynchronously
    requestAnimationFrame(() => {
      loadCSS('https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css');
    });
  </script>
  
  <!-- Main App Script -->
  <script type="module" src="/src/main.jsx"></script>
  
  <!-- Remove loading indicator after app loads -->
  <script>
    window.addEventListener('load', () => {
      const loading = document.getElementById('app-loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(() => loading.remove(), 300);
      }
    });
  </script>
</body>
